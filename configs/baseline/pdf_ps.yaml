# PDF+PS reference: NLE directly on the 30 hand-crafted summaries (15 PDF + 15 PS), no compression.
# theta has 5 columns (f_esc last); stage 4 evaluates the first four.
name: baseline/pdf_ps
out_root: ${SBI_OUT}
n_params: 5
seeds:
  nle: [42, 43, 44]

data:
  summaries_npz: ${SBI_SUMMARIES}

compressor:
  type: none

nle:
  split_seed: 42            # train/val split of simulations
  val_frac: 0.1
  nsplit: 10
  batch_size: 32
  lr_phase1: 2.0e-4
  lr_phase2: 2.0e-5
  num_workers: 2
  hidden: 64
  n_layers: 4
  num_bins: 8
  tail_bound: 5.0

mcmc:
  target_path: ${SBI_SBC_TARGETS}
  walkers: 160
  steps: 2000
  burnin: 500
  seed: 13                  # chain seed = seed + sim id
  loglik_batch_size: 8192
  use_wedge_prior: true
  wedge_tau_idx: 1
  wedge_mmin_idx: 3
